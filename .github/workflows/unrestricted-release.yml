name: 无区域限制构建

# 监测上游 PCL-Community/PCL-CE 的新 release：
#   1. 找到还没构建过的 tag
#   2. 拉取该 tag 的源码
#   3. 应用最小化改动（scripts/strip_region_gate.py）
#   4. 编译 x64 / ARM64 单文件 exe
#   5. 在本仓库以同名 tag 发布 Release

on:
  schedule:
    - cron: '23 */2 * * *'   # 每 2 小时检查一次（GitHub 的 cron 可能延迟几分钟）
  workflow_dispatch:
    inputs:
      tag:
        description: '指定上游 release tag（留空 = 自动扫描最新）'
        required: false
        default: ''
      include_prerelease:
        description: '同时处理 pre-release'
        type: boolean
        default: false
      force:
        description: '已发布过的 tag 也重新构建'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: unrestricted-release
  cancel-in-progress: false

env:
  UPSTREAM: PCL-Community/PCL-CE
  GH_TOKEN: ${{ github.token }}
  MIN_VERSION: 'v2.15.1'   # 区域限制自该版本引入，更早的 tag 跳过
  MAX_PER_RUN: '5'         # 单次最多构建几个版本

jobs:
  plan:
    name: 计算待构建版本
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: 扫描上游 release
        id: plan
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INCLUDE_PRE: ${{ github.event.inputs.include_prerelease }}
          FORCE: ${{ github.event.inputs.force }}
        run: python3 scripts/plan_builds.py

  build:
    name: 构建 ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 拉取上游同版本源码
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ matrix.tag }}" "https://github.com/${UPSTREAM}.git" upstream
          sha="$(git -C upstream rev-parse HEAD)"
          echo "UPSTREAM_SHA=$sha" >> "$GITHUB_ENV"
          echo "上游 commit: $sha"
          git -C upstream describe --tags --always

      - name: 应用最小化改动
        shell: bash
        run: |
          set -euo pipefail
          python scripts/strip_region_gate.py upstream
          echo '--- 改动内容 ---'
          git -C upstream diff

      # 上游用 PCL_WRITE_SECRET + PCL_* 环境变量把密钥编进 EnvironmentInterop.SecretDictionary。
      # Release 构建里 Secrets.GetSecret(..., readEnvDebugOnly: true) 不会读运行时环境变量，
      # 所以这些值只能在编译期注入；缺 PCL_MS_CLIENT_ID 就会「Microsoft OAuth client id is not configured」。
      - name: 编译 x64
        shell: bash
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.PCL_CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.PCL_SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.PCL_NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.PCL_NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.PCL_LINK_SERVER_ROOT }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.PCL_LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ env.UPSTREAM_SHA }}
        run: |
          set -euo pipefail
          if [ -z "${PCL_MS_CLIENT_ID}" ]; then
            echo "::warning::仓库未配置 secret PCL_MS_CLIENT_ID，本次产物的微软正版登录不可用"
          fi
          if [ -z "${PCL_CURSEFORGE_API_KEY}" ]; then
            echo "::warning::仓库未配置 secret PCL_CURSEFORGE_API_KEY，CurseForge 下载可能返回 403"
          fi
          dotnet publish "upstream/Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -c Release -p:Platform=x64 -p:DeleteExistingFiles=true \
            -o "$GITHUB_WORKSPACE/out/x64" --no-self-contained

      - name: 编译 ARM64
        shell: bash
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.PCL_CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.PCL_SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.PCL_NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.PCL_NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.PCL_LINK_SERVER_ROOT }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.PCL_LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ env.UPSTREAM_SHA }}
        run: |
          set -euo pipefail
          dotnet publish "upstream/Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -c Release -p:Platform=ARM64 -p:DeleteExistingFiles=true \
            -o "$GITHUB_WORKSPACE/out/arm64" --no-self-contained

      - name: 整理产物
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "out/x64/Plain Craft Launcher 2.exe"   "dist/PCL2_CE_${TAG}_x64_unrestricted.exe"
          cp "out/arm64/Plain Craft Launcher 2.exe" "dist/PCL2_CE_${TAG}_ARM64_unrestricted.exe"
          ( cd dist && sha256sum ./*.exe > SHA256SUMS.txt )
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: 产物自检
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          marker = "region-policy-disabled".encode("utf-16-le")
          exes = sorted(pathlib.Path("dist").glob("*.exe"))
          if not exes:
              print("::error::dist 目录没有产物"); sys.exit(1)
          bad = [p.name for p in exes if marker not in p.read_bytes()]
          print("checked:", ", ".join(p.name for p in exes))
          if bad:
              print("::error::产物里没有补丁标记，改动可能没生效: " + ", ".join(bad)); sys.exit(1)
          print("ok: 产物均包含 region-policy-disabled 标记")

          cid = os.environ.get("MS_CLIENT_ID", "").strip()
          if cid:
              baked = cid.encode("utf-16-le")
              missing = [p.name for p in exes if baked not in p.read_bytes()]
              if missing:
                  print("::error::secret 已配置但产物里没有内嵌 client id，微软登录仍会失败: " + ", ".join(missing)); sys.exit(1)
              print("ok: 产物已内嵌 PCL_MS_CLIENT_ID")
          else:
              print("::warning::未配置 PCL_MS_CLIENT_ID，产物不支持微软正版登录")
          PY

      - name: 生成发布说明
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
          MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
          CF_KEY: ${{ secrets.PCL_CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${MS_CLIENT_ID}" ]; then
            LOGIN_LINE="微软正版登录可用（构建时已内嵌 client id）"
          else
            LOGIN_LINE="⚠ 本构建**未**内嵌微软 client id：正版登录会报 \`Microsoft OAuth client id is not configured\`，请改用「离线验证」账号"
          fi
          if [ -n "${CF_KEY}" ]; then
            CF_LINE="CurseForge 下载可用（已内嵌 API Key）"
          else
            CF_LINE="⚠ 未内嵌 CurseForge API Key，CurseForge 源可能返回 403"
          fi
          cat > notes.md <<EOF
          ## ${TAG} · 无区域限制构建

          源码取自上游 [\`${UPSTREAM}\`](https://github.com/${UPSTREAM}/tree/${TAG}) 的 \`${TAG}\` tag，
          仅做一处最小改动，其余与官方一致。

          ### 改动

          \`\`\`diff
          - internal static RegionAssessment Assess() => RegionPolicy.Evaluate(RegionPolicy.ReadWindowsSignals());
          + internal static RegionAssessment Assess() => new(RegionClassification.Other, "region-policy-disabled");
          \`\`\`

          上游自 2.15.1 起把「中国大陆区域」判定集中在 \`PCL.RestrictedFeaturePolicy\`，
          15 处下载 / 安装 / 补全 / 启动前检查入口都经过它的 \`IsRestricted\` / \`Check\` / \`ThrowIfRestricted\`，
          三者全部以 \`Assess()\` 的返回值为准。让 \`Assess()\` 恒定返回 \`Other\`，
          所有入口同时放行，且不再弹提示、不再写拦截日志。

          ### 登录与下载

          - ${LOGIN_LINE}
          - ${CF_LINE}
          - 需要正版验证的服务器必须用「正版验证」账号；纯本地游玩用「离线验证」即可。

          ### 产物

          - \`PCL2_CE_${TAG}_x64_unrestricted.exe\` — 单文件，需 .NET 10 Desktop Runtime
          - \`PCL2_CE_${TAG}_ARM64_unrestricted.exe\` — 单文件，需 .NET 10 Desktop Runtime
          - \`SHA256SUMS.txt\`

          ### 说明

          - 与官方发布同规格：\`dotnet publish -c Release -p:Platform=<arch> --no-self-contained\`，单文件。
          - 程序会在 exe 同级创建 \`PCL\` 数据目录，不会覆盖 \`%APPDATA%\PCLCE\` 里的既有配置。
          - 仅供本地测试与研究使用；上游代码版权归原作者所有（见上游 LICENSE）。
          EOF
          cat notes.md

      - name: 发布 Release
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
          IS_PRE: ${{ matrix.prerelease }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "tag ${TAG} 已存在于本仓库"
          else
            git fetch --no-tags --depth=1 "https://github.com/${UPSTREAM}.git" "refs/tags/${TAG}:refs/tags/${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} 已存在，覆盖上传产物并刷新说明"
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --notes-file notes.md
          else
            FLAGS=()
            if [ "${IS_PRE}" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "${TAG}" dist/* \
              --title "${TAG} · 无区域限制构建" \
              --notes-file notes.md \
              "${FLAGS[@]}"
          fi
          gh release view "${TAG}" --json tagName,url,assets --jq '.tagName + " " + .url'

  report:
    name: 汇总
    needs: [plan, build]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: 写入 job summary
        run: |
          echo "### 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 计划: \`${{ needs.plan.result }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 构建: \`${{ needs.build.result }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本: \`${{ needs.plan.outputs.matrix }}\`" >> "$GITHUB_STEP_SUMMARY"
